<!DOCTYPE html>
<html>
    <head>
        <title>Positioning</title>
        <style>
            div {
                right: 30px;
                border: 3px solid orangered;
            }

            div.absolute {
                position: absolute;
                left: 50px;
                border: 3px solid orange;
            }

            div.relative {
                position: relative;
                left: 100px;
                border: 3px solid orangered;
            }

            div.fixed {
                position: fixed;
                top: 0;
                right: 20px;
                width: 300px;
                border: 3px solid orangered;
            }

            div.sticky {
                position: sticky;
                top: 1px;
                left: 20px;
                width: 100px;
                border: 3px solid orangered;
            }
        </style>
    </head>

    <body>
        <!--change the position to show the difference:
        static
        relative
        fixed
        absolute
        sticky-->
        <h2>POSITIONING</h2>
        <div>
            Div with no position property
        </div>
        <div class="sticky">
            Div class with sticky position property
        </div>
        <div class="relative">
            This div element has position: relative;
            <div class="absolute">
                Absolute div class
            </div>
        </div>
        <div class="fixed">
            Div with fixed position property
        </div>
